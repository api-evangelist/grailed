aid: grailed
name: Grailed
description: >-
  Grailed is a peer-to-peer online marketplace for buying, selling, and
  discovering luxury, designer, vintage, and streetwear fashion for both men and
  women. Founded in 2013 and owned by GOAT Group, the platform lets independent
  sellers list clothing, footwear, accessories, and jewelry while Grailed
  facilitates the transaction, offering digital listing verification by trained
  moderators, purchase protection on qualifying orders, secure third-party
  payment processing (card, PayPal, Apple Pay, Klarna), and a community trust
  and seller-rating system. Grailed does not publish a public developer API; it
  exposes a consumer web and mobile experience, an agent-facing /llms.txt, and a
  RFC 9116 security.txt with a bug bounty program. This profile was surfaced as a
  portfolio company of Index Ventures and enriched by the API Evangelist pipeline.
